<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iyra - Coming Soon</title>
    <style>
        /* --- PINK & WHITE THEME --- */
        :root {
            /* Palette Definition */
            --primary-pink: #ec4899;      /* Vibrant Pink */
            --dark-pink: #831843;         /* Deep Maroon/Pink for text */
            --light-pink-bg: #fce7f3;     /* Very pale pink for background */
            --white: #ffffff;
            --glass-border: rgba(255, 255, 255, 0.6);
            --shadow: rgba(236, 72, 153, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
            /* Soft Pink Gradient Background */
            background: linear-gradient(135deg, #fff1f2 0%, #fbcfe8 100%);
            color: var(--dark-pink);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            padding: 50px 40px;
            
            /* White Card Style */
            background: var(--white);
            border-radius: 24px;
            box-shadow: 0 20px 40px var(--shadow);
            border: 1px solid white;
        }

        /* Status Badge */
        .status-badge {
            display: inline-block;
            background: #fdf2f8; /* very light pink */
            color: var(--primary-pink);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            border: 1px solid #fbcfe8;
        }

        /* Brand Name */
        h1 {
            font-size: 5rem; 
            margin-bottom: 0.5rem;
            letter-spacing: -2px;
            color: var(--primary-pink);
            /* Optional: Gradient text effect */
            background: -webkit-linear-gradient(45deg, #ec4899, #be185d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            line-height: 1;
        }

        p.subtitle {
            font-size: 1.1rem;
            color: #9d5c75; /* Muted pink-grey */
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        /* Subscription Form */
        .newsletter {
            margin-top: 1rem;
        }

        .input-group {
            display: flex;
            gap: 10px;
            position: relative;
        }

        input[type="email"] {
            flex: 1;
            padding: 16px 24px;
            border-radius: 50px;
            border: 2px solid #f3f4f6;
            background: #f9fafb;
            color: var(--dark-pink);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="email"]::placeholder {
            color: #d1d5db;
        }

        input[type="email"]:focus {
            border-color: var(--primary-pink);
            background: var(--white);
        }

        button {
            padding: 16px 32px;
            border-radius: 50px;
            border: none;
            /* Pink Gradient Button */
            background: linear-gradient(90deg, #ec4899, #be185d);
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(236, 72, 153, 0.4);
        }

        /* Footer */
        footer {
            margin-top: 3rem;
            font-size: 0.8rem;
            color: #9d5c75;
            opacity: 0.8;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            h1 { font-size: 3.5rem; }
            .container { padding: 30px 20px; box-shadow: none; background: transparent; }
            .input-group { flex-direction: column; }
            button { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="status-badge">Work In Progress</div>

        <h1>Iyra</h1>
        
        <p class="subtitle">
            Grace, style, and innovation.<br>
            We are preparing to unveil our new collection.
        </p>

        <div class="newsletter">
            <form class="input-group" id="notifyForm">
                <input type="email" id="emailInput" placeholder="Enter your email" required>
                <button type="submit">Notify Me</button>
            </form>
            <p id="successMessage" style="display:none; margin-top: 15px; color: var(--primary-pink); font-weight: 500;">
                Beautiful! You are on the list.
            </p>
        </div>

        <footer>
            &copy; <span id="year"></span> Iyra Official.
        </footer>
    </div>

    <script>
        // --- JAVASCRIPT LOGIC ---

        // 1. Auto-update Copyright Year
        document.getElementById('year').textContent = new Date().getFullYear();

        // 2. Handle Form Submission
        document.getElementById('notifyForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            
            const btn = this.querySelector('button');
            const msg = document.getElementById('successMessage');

            // Simulate loading
            const originalText = btn.innerHTML;
            btn.innerHTML = "Joining...";
            btn.style.opacity = "0.8";

            // Simulate API delay
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.style.opacity = "1";
                
                // Show success
                msg.style.display = "block";
                document.getElementById('emailInput').value = ""; 
            }, 1000);
        });
    </script>
</body>
</html>
